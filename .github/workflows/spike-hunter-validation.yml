name: Offline Spike Hunter validation

on:
  push:
    branches: [spike-hunter-validation-20261004]
  workflow_dispatch:
    inputs:
      reproduce_history:
        description: Recollect frozen public history and reproduce the full study
        type: boolean
        default: false

permissions:
  contents: read

env:
  LIVE_TRADING: "false"
  READY_FOR_LIVE: "false"
  LIVE_ALLOWED: "false"
  OPENED_TRADES: "false"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-research-lock.txt
      - run: python -m pytest
      - run: python -m compileall -q backend/app/research scripts/collect_spike_history.py scripts/run_spike_hunter_study.py scripts/diagnose_spike_atr_matching.py scripts/verify_spike_inference.py scripts/run_spike_payoff_study.py scripts/verify_spike_payoff.py scripts/diagnose_spike_target_order.py scripts/run_spike_timed_study.py scripts/verify_spike_timed.py scripts/run_spike_learned_study.py scripts/verify_spike_learned.py scripts/diagnose_learned_transfer.py scripts/run_spike_native300_study.py scripts/verify_spike_native300.py scripts/run_spike_multiframe_study.py scripts/verify_spike_multiframe.py scripts/run_spike_nonlinear_study.py scripts/verify_spike_nonlinear.py scripts/collect_spike_ticks.py scripts/run_spike_tick_execution.py scripts/verify_spike_tick_execution.py scripts/run_spike_tick_tail.py scripts/verify_spike_tick_tail.py scripts/run_spike_tick_age_payoff.py scripts/verify_spike_tick_tail_signal.py scripts/run_spike_tick_path_risk.py scripts/verify_spike_tick_path_risk.py scripts/run_spike_short_target.py scripts/verify_spike_short_target.py scripts/run_spike_short_tick.py scripts/verify_spike_short_tick.py scripts/probe_public_quote_contract.py scripts/diagnose_frozen_cost_ceiling.py scripts/run_tail_successor.py scripts/verify_tail_successor.py
      - run: python docs/public_quote_contract_20261007/review_capture01.py
      - name: Reproduce saved descriptive public-field inventory
        run: |
          python docs/provider_evidence_20261009/review_inventory.py --output docs/provider_evidence_20261009/ci_inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("docs/provider_evidence_20261009")
          saved = json.loads((folder / "inventory.json").read_text())
          reproduced = json.loads((folder / "ci_inventory.json").read_text())
          for record in (saved, reproduced):
              record.pop("reviewed_utc")
          if saved != reproduced:
              raise ValueError("Saved descriptive inventory differs from exact-capture reproduction")
          print("Descriptive inventory reproduction PASS; no predictive or profit test")
          PY
      - run: python docs/provider_evidence_20261009/independent_inventory_review.py
      - name: Reproduce stable-positive objective assessment from saved statistics
        run: |
          python docs/stable_profit_assessment_20261009/screen_saved_results.py --self-test
          python docs/stable_profit_assessment_20261009/screen_saved_results.py --output docs/stable_profit_assessment_20261009/ci_assessment.json
          python docs/stable_profit_assessment_20261009/verify_saved_pointers.py
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("docs/stable_profit_assessment_20261009")
          saved = json.loads((folder / "assessment.json").read_text())
          reproduced = json.loads((folder / "ci_assessment.json").read_text())
          for record in (saved, reproduced):
              record.pop("screened_utc")
          if saved != reproduced:
              raise ValueError("Saved stable-profit necessary assessment differs")
          print("Saved-statistic stable-profit necessary screen PASS; no qualified policy")
          PY
      - name: Review saved public contract capabilities without network calls
        run: |
          python -m unittest discover -s docs/public_contract_capability_20261009 -p 'test_probe*.py' -v
          python docs/public_contract_capability_20261009/review_capture.py --self-test
          python docs/public_contract_capability_20261009/review_capture.py --capture docs/public_contract_capability_20261009/capture01 --expect-status INCOMPLETE
          python docs/public_contract_capability_20261009/review_capture.py --capture docs/public_contract_capability_20261009/capture02 --expect-status PASS
          python docs/public_contract_capability_20261009/compare_content.py --output docs/public_contract_capability_20261009/ci_content_comparison.json
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("docs/public_contract_capability_20261009")
          if json.loads((folder / "content_comparison.json").read_text()) != json.loads((folder / "ci_content_comparison.json").read_text()):
              raise ValueError("Saved public capability content comparison differs")
          print("Public capability evidence reviewed; first capture remains incomplete; no predictive or profit test")
          PY

  historical-study:
    if: github.event_name == 'workflow_dispatch' && inputs.reproduce_history
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-research-lock.txt
      - name: Collect public candles without account access
        run: python scripts/collect_spike_history.py --days 180 --symbols BOOM500 CRASH500 --cutoff-epoch 1791112080 --output-dir data/recollect
      - name: Run frozen offline protocol
        run: |
          python scripts/run_spike_hunter_study.py \
            --dataset BOOM500=data/recollect/boom500_m1_180d_clean.csv \
            --dataset CRASH500=data/recollect/crash500_m1_180d_clean.csv \
            --output study-results --bootstrap 9999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-spike-hunter-study
          path: |
            study-results/
            data/recollect/*manifest.json
          if-no-files-found: warn
